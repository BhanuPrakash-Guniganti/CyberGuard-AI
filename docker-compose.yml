version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cyberguard_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cyberguard_ai

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=cyberguard_ai
      - SECRET_KEY=cyberguard_super_secret_jwt_key_2026_demo_soc
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-1.5-flash
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguard_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
